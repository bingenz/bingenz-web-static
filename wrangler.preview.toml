# Isolated commerce preview. Never point this config at the production Worker or legacy D1.
name = "bingenz-commerce-preview"
main = "src/worker.mjs"
compatibility_date = "2026-09-16"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "bingenz-commerce-preview"
database_id = "45e95b13-841f-4e71-b21c-5055758f8607"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SIMULATIONS"
bucket_name = "bingenz-commerce-preview"

[vars]
BANK_CODE = "TPBank"
ADMIN_EMAIL = "lengocthuan09@gmail.com"
TURNSTILE_HOSTNAMES = "bingenz-commerce-preview.lnth.workers.dev"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01
