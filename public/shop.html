<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Khám phá các mô phỏng công nghệ tương tác của BinGenZ.">
  <meta id="metaThemeColor" name="theme-color" content="#09090c">
  <title>Cửa hàng mô phỏng • BinGenZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=20261004-3">
  <link rel="stylesheet" href="/commerce.css?v=20261004-3">
</head>
<body class="commerce-body shop-body">
  <header class="shop-site-header">
    <div class="shop-header-inner">
      <a class="shop-brand" href="/#store" aria-label="BinGenZ - Sản phẩm">
        <span class="shop-brand-mark" aria-hidden="true">B</span>
        <span>BinGenZ</span>
      </a>
      <a class="checkout-back-link route-back-link" href="/#store"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6 6-6-6 6-6"/></svg><span>Sản phẩm</span></a>
      <nav class="shop-nav" aria-label="Điều hướng cửa hàng">
        <a class="is-active" href="/#store">Sản phẩm</a>
        <a href="/#source-code">Dịch vụ</a>
        <a href="/#contact">Hỗ trợ</a>
      </nav>
      <div class="shop-header-actions">
        <button class="icon-button" id="commerce-theme" type="button" aria-label="Chuyển sang giao diện tối">
          <svg class="theme-dark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          <svg class="theme-light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="header-cart-button" type="button" data-open-cart aria-label="Mở giỏ hàng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h15l-1.5 8.5H8L6 4H3"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
          <span class="header-cart-label">Giỏ hàng</span>
          <strong data-cart-count>0</strong>
        </button>
      </div>
    </div>
  </header>
  <main id="shop-page" class="commerce shop-page" aria-live="polite">
    <div class="shop-page-loading" role="status">
      <span class="loading-orb" aria-hidden="true"></span>
      <p>Đang chuẩn bị cửa hàng…</p>
    </div>
  </main>
  <div class="commerce-toast" id="shop-announcement" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/commerce.mjs?v=20261004-3"></script>
</body>
</html>
