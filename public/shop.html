<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Khám phá các mô phỏng công nghệ tương tác của BinGenZ.">
  <meta id="metaThemeColor" name="theme-color" content="#09090c">
  <title>Cửa hàng mô phỏng • BinGenZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/commerce.css">
</head>
<body class="commerce-body shop-body">
  <header class="shop-site-header">
    <div class="shop-header-inner">
      <a class="shop-brand" href="/#store" aria-label="BinGenZ - Sản phẩm">
        <span class="shop-brand-mark" aria-hidden="true">B</span>
        <span>BinGenZ</span>
      </a>
      <nav class="shop-nav" aria-label="Điều hướng cửa hàng">
        <a class="is-active" href="/#store">Sản phẩm</a>
        <a href="/#source-code">Dịch vụ</a>
        <a href="/#contact">Hỗ trợ</a>
      </nav>
      <div class="shop-header-actions">
        <button class="icon-button" id="commerce-theme" type="button" aria-label="Đổi giao diện">
          <span class="theme-dark-icon" aria-hidden="true">☾</span>
          <span class="theme-light-icon" aria-hidden="true">☀</span>
        </button>
        <button class="header-cart-button" type="button" data-open-cart aria-label="Mở giỏ hàng">
          <span aria-hidden="true">▣</span>
          <span class="header-cart-label">Giỏ hàng</span>
          <strong data-cart-count>0</strong>
        </button>
      </div>
    </div>
  </header>
  <main id="shop-page" class="commerce shop-page" aria-live="polite">
    <div class="shop-page-loading" role="status">
      <span class="loading-orb" aria-hidden="true"></span>
      <p>Đang chuẩn bị cửa hàng…</p>
    </div>
  </main>
  <div class="commerce-toast" id="shop-announcement" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/commerce.mjs"></script>
</body>
</html>
