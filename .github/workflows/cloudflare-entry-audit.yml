name: Manage Cloudflare entry challenges

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Audit, exempt public browsing from the identified challenge, or roll back that exception
        type: choice
        required: true
        default: audit
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect challenge settings for bingenz.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/audit-cloudflare-entry.py
      - name: Adjust only the identified public-entry challenge rule
        if: inputs.operation == 'apply' || inputs.operation == 'rollback'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: python3 scripts/configure-cloudflare-entry.py "$OPERATION"
